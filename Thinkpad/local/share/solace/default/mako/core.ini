anchor=top-right
group-by=app-name,summary,body
default-timeout=4000
width=420
outer-margin=20
padding=10
border-size=1
border-radius=15
max-icon-size=32
font=Liberation Sans 11

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

[urgency=critical]
default-timeout=0
layer=overlay

[summary~="Setup Wi-Fi"]
on-button-left=exec sh -c 'solace-notification-dismiss "Setup Wi-Fi"; solace-launch-wifi'

[summary~="Update System"]
on-button-left=exec sh -c 'solace-notification-dismiss "Update System"; solace-launch-floating-terminal-with-presentation solace-update'

[summary~="Learn Keybindings"]
on-button-left=exec sh -c 'solace-notification-dismiss "Learn Keybindings"; solace-menu-keybindings'

[summary~="Install Dictation with Voxtype"]
on-button-left=exec sh -c 'solace-notification-dismiss "Install Dictation with Voxtype"; solace-launch-floating-terminal-with-presentation solace-voxtype-install'

[summary~="Screenshot copied & saved"]
max-icon-size=80
format=<b>%s</b>\n%b
