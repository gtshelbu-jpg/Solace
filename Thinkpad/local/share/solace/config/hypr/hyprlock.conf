source = ~/.config/solace/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    color = $color
    path = ~/.config/solace/current/background
    blur_passes = 3
    blur_size = 8
}

animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

image {
    monitor =
    path = ~/.local/share/solace/default/sddm/solace/logo.png
    size = 280
    rounding = 0
    border_size = 0

    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 42
    color = $font_color

    position = 0, -12
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    color = $muted_color

    position = 0, -58
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 440, 56
    position = 0, -132
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 1

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = <span foreground="##aeb7c8">Password</span>
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <span foreground="##ffb4ab"><i>$FAIL ($ATTEMPTS)</i></span>

    rounding = 18
    shadow_passes = 2
    shadow_size = 18
    shadow_color = rgba(0, 0, 0, 0.35)
    fade_on_empty = false
    dots_spacing = 0.22
}

label {
    monitor =
    text = Solace
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = $muted_color

    position = 0, 32
    halign = center
    valign = bottom
}

auth {
    fingerprint:enabled = false
}
