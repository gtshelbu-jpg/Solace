general {
    lock_cmd = solace-system-lock                         # lock screen and 1password
    before_sleep_cmd = SOLACE_LOCK_ONLY=true solace-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && solace-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = pidof hyprlock || solace-launch-screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = solace-system-lock
    on-resume = solace-system-wake
}
