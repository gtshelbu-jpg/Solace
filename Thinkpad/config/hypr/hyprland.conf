# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Solace defaults (but don't edit these directly!)
source = ~/.local/share/solace/default/hypr/autostart.conf
source = ~/.local/share/solace/default/hypr/bindings/media.conf
source = ~/.local/share/solace/default/hypr/bindings/clipboard.conf
source = ~/.local/share/solace/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/solace/default/hypr/bindings/utilities.conf
source = ~/.local/share/solace/default/hypr/envs.conf
source = ~/.local/share/solace/default/hypr/looknfeel.conf
source = ~/.local/share/solace/default/hypr/input.conf
source = ~/.local/share/solace/default/hypr/windows.conf
source = ~/.config/solace/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

decoration {
    active_opacity = 0.94
    inactive_opacity = 0.90
}

# Toggle config flags dynamically
source = ~/.local/state/solace/toggles/hypr/*.conf
